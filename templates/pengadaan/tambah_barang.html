<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Barang Pengadaan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h4 class="fw-bold text-success mb-3">📦 Tambah Barang / Bahan ke Gudang {{ gudang_param }}</h4>
            
            <form method="POST">
                <input type="hidden" name="gudang_pabrik" value="{{ gudang_param }}">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Nama Barang / Sparepart</label>
                    <input type="text" name="nama_barang" class="form-control" placeholder="Contoh: Oli Mesin / Bearing" required>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Jumlah Stok Awal</label>
                        <input type="number" name="stok" class="form-control" min="0" value="0" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Satuan</label>
                        <input type="text" name="satuan" class="form-control" placeholder="Pcs / Liter / Unit" required>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success w-100 fw-bold">💾 Simpan Barang</button>
                    <a href="{{ url_for('pengadaan.daftar_barang', gudang=gudang_param) }}" class="btn btn-outline-secondary w-100">Kembali</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
