<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Laporan Kerusakan - Teknik Pabrik</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('laporan.daftar_laporan') }}">Teknik Pabrik - Buat Laporan</a>
            <div class="navbar-nav ms-auto">
                <a href="{{ url_for('laporan.daftar_laporan') }}" class="btn btn-outline-light btn-sm">Kembali ke Daftar</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 650px;">
        <div class="card shadow-sm border-0 p-4 bg-white mb-5">
            <h4 class="fw-bold text-success mb-3">📝 Form Laporan Kerusakan Mesin</h4>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show small shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('laporan.buat_laporan') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Lokasi Pabrik yang Mengalami Kerusakan</label>
                    <select name="lokasi_pabrik" class="form-select form-select-sm" required>
                        <option value="">-- Pilih Lokasi Pabrik --</option>
                        <option value="Sedep">1. Sedep</option>
                        <option value="Arumsari">2. Arumsari</option>
                        <option value="Talun">3. Talun</option>
                        <option value="Santosa">4. Santosa</option>
                        <option value="Purbasari">5. Purbasari</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Pilih Mesin</label>
                    <select name="mesin_id" class="form-select form-select-sm" required>
                        <option value="">-- Pilih Mesin --</option>
                        {% for m in mesin_list %}
                        <option value="{{ m.id }}">{{ m.kode_mesin }} - {{ m.nama_mesin }} (Lokasi: {{ m.lokasi }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Tanggal Laporan</label>
                    <input type="date" name="tanggal_laporan" class="form-control form-control-sm" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Deskripsi Kerusakan</label>
                    <textarea name="deskripsi" class="form-control form-control-sm" rows="4" placeholder="Jelaskan detail kerusakan mesin..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Bukti Foto Kerusakan (Opsional)</label>
                    <input type="file" name="foto_bukti" class="form-control form-control-sm" accept="image/*">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-sm w-100 fw-bold py-2">🚀 Kirim Laporan Kerusakan</button>
                    <a href="{{ url_for('laporan.daftar_laporan') }}" class="btn btn-outline-secondary btn-sm w-100 py-2">Batal</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
